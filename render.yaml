services:
  - type: web
    name: lecturenote-ai-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: lecturenote_ai
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: ALLOW_MODEL_DOWNLOAD
        value: "false"
      - key: WARMUP_MODELS
        value: "false"
